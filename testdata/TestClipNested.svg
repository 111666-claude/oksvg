<svg width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <clipPath id="outer">
      <rect x="0" y="0" width="60" height="60"/>
    </clipPath>
    <clipPath id="inner">
      <rect x="30" y="30" width="60" height="60"/>
    </clipPath>
  </defs>
  <g clip-path="url(#outer)">
    <rect x="0" y="0" width="100" height="100" fill="#ff0000" clip-path="url(#inner)"/>
  </g>
</svg>
