<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <defs>
    <symbol id="a" viewBox="0 0 50 50">
      <use href="#b" width="50" height="50"/>
