<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 200">
  <!-- Symbol with a non-square viewBox; the inner rect fills the viewBox and
       the circle is centered, so meet/slice/none alignment is visible. -->
  <defs>
    <symbol id="box" viewBox="0 0 100 50" preserveAspectRatio="xMidYMid meet">
      <rect x="0" y="0" width="100" height="50" fill="none" stroke="black" stroke-width="2"/>
      <circle cx="50" cy="25" r="20" fill="red"/>
    </symbol>
    <symbol id="boxSlice" viewBox="0 0 100 50" preserveAspectRatio="xMidYMid slice">
      <rect x="0" y="0" width="100" height="50" fill="none" stroke="black" stroke-width="2"/>
      <circle cx="50" cy="25" r="20" fill="green"/>
    </symbol>
    <symbol id="boxNone" viewBox="0 0 100 50" preserveAspectRatio="none">
      <rect x="0" y="0" width="100" height="50" fill="none" stroke="black" stroke-width="2"/>
      <circle cx="50" cy="25" r="20" fill="blue"/>
    </symbol>
  </defs>

  <!-- meet: uniform scale, centered with empty bands on the sides -->
  <use href="#box" x="10" y="20" width="80" height="80"/>
  <!-- slice: uniform scale covering the viewport, cropped top and bottom -->
  <use xlink:href="#boxSlice" x="160" y="20" width="80" height="80"/>
  <!-- none: non-uniform scale stretching the circle into an ellipse -->
  <use href="#boxNone" x="310" y="20" width="80" height="80"/>
</svg>
