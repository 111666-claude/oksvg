<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 300">
  <defs>
    <!-- Symbol with nested groups, own fill/stroke and a translated inner group. -->
    <symbol id="marker" viewBox="0 0 100 100">
      <g>
        <rect x="10" y="10" width="80" height="80" fill="#3366cc" stroke="black" stroke-width="4"/>
        <g transform="translate(50,50)">
          <circle r="25" fill="#ffcc00" stroke="white" stroke-width="3"/>
          <path d="M-10,-10 L10,-10 L0,15 Z" fill="black"/>
        </g>
      </g>
    </symbol>
  </defs>

  <!-- Same symbol at two different sizes. -->
  <use href="#marker" x="10" y="10" width="90" height="90"/>
  <use href="#marker" x="150" y="120" width="45" height="45"/>
  <!-- Rotated instance: the use element carries its own transform and style. -->
  <use href="#marker" x="200" y="20" width="80" height="80"
       transform="rotate(45 240 60)" fill-opacity="0.7"/>
</svg>
